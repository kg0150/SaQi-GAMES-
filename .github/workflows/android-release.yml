name: Android Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Prepare Release Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "PatrolCityRelease2026" \
              -keypass "PatrolCityRelease2026" \
              -dname "CN=PatrolCity, OU=Mobile, O=PatrolCityStudio, L=Mumbai, ST=MH, C=IN"
            echo "STORE_PASSWORD=PatrolCityRelease2026" >> $GITHUB_ENV
            echo "KEY_PASSWORD=PatrolCityRelease2026" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build Debug & Release APKs
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease
          else
            gradle :app:assembleDebug :app:assembleRelease
          fi
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PatrolCity-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatrolCity-release-apk
          path: |
            app/build/outputs/apk/release/PatrolCity-release.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Patrol City 3D ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/PatrolCity-release.apk
